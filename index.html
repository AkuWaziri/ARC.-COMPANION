<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Provide basic Web3 browser polyfills
          if (!window.global) {
            window.global = window;
          }
          if (!window.process) {
            window.process = { env: { NODE_ENV: 'development' } };
          } else if (!window.process.env) {
            window.process.env = { NODE_ENV: 'development' };
          }
          if (!window.Buffer) {
            window.Buffer = {
              isBuffer: function() { return false; },
              from: function() { return []; },
              concat: function() { return []; },
              alloc: function() { return []; }
            };
          }

          var ignoreErrorPattern = /has not been authorized yet|walletconnect|reown|closed without opened|without opened|vite-ping|failed to connect to websocket|wss?:|code: 3000|JWT validation error|Serialization error|EOF while parsing|connection closed abnormally/i;

          var getErrorMessage = function(arg) {
            if (!arg) return '';
            if (arg instanceof Error) {
              return arg.message + ' ' + (arg.stack || '');
            }
            if (typeof arg === 'string') {
              return arg;
            }
            try {
              if (arg.message) {
                return String(arg.message);
              }
              return String(arg);
            } catch (e) {
              return '';
            }
          };

          // 1. Console patch
          var originalConsoleError = console.error;
          console.error = function () {
            var args = Array.prototype.slice.call(arguments);
            var message = args.map(getErrorMessage).join(' ');
            if (ignoreErrorPattern.test(message)) {
              return;
            }
            originalConsoleError.apply(console, arguments);
          };

          var originalConsoleWarn = console.warn;
          console.warn = function () {
            var args = Array.prototype.slice.call(arguments);
            var message = args.map(getErrorMessage).join(' ');
            if (ignoreErrorPattern.test(message)) {
              return;
            }
            originalConsoleWarn.apply(console, arguments);
          };

          // 2. document.createElement hook
          if (typeof document !== 'undefined') {
            var originalCreateElement = document.createElement;
            document.createElement = function (tagName, options) {
              var element = originalCreateElement.call(document, tagName, options);
              if (tagName && tagName.toLowerCase() === 'iframe') {
                var originalSetAttribute = element.setAttribute;
                element.setAttribute = function (name, value) {
                  if (name && name.toLowerCase() === 'src' && typeof value === 'string' && (value.includes('verify.walletconnect') || value.includes('verify.reown') || value.includes('walletconnect.org') || value.includes('walletconnect.com') || value.includes('reown.com'))) {
                    value = 'about:blank';
                  }
                  return originalSetAttribute.call(element, name, value);
                };
                Object.defineProperty(element, 'src', {
                  get: function() {
                    return element.getAttribute('src') || '';
                  },
                  set: function(value) {
                    if (typeof value === 'string' && (value.includes('verify.walletconnect') || value.includes('verify.reown') || value.includes('walletconnect.org') || value.includes('walletconnect.com') || value.includes('reown.com'))) {
                      value = 'about:blank';
                    }
                    element.setAttribute('src', value);
                  },
                  configurable: true,
                  enumerable: true
                });
              }
              return element;
            };

            // MutationObserver
            var observer = new MutationObserver(function(mutations) {
              for (var i = 0; i < mutations.length; i++) {
                var mutation = mutations[i];
                if (mutation.type === 'childList') {
                  for (var j = 0; j < mutation.addedNodes.length; j++) {
                    var node = mutation.addedNodes[j];
                    if (node.nodeType === 1) {
                      var element = node;
                      var iframes = element.tagName && element.tagName.toLowerCase() === 'iframe'
                        ? [element]
                        : Array.prototype.slice.call(element.querySelectorAll('iframe'));
                      for (var k = 0; k < iframes.length; k++) {
                        var iframe = iframes[k];
                        var src = iframe.getAttribute('src') || '';
                        if (src.includes('verify.walletconnect') || src.includes('verify.reown') || src.includes('walletconnect.org') || src.includes('walletconnect.com') || src.includes('reown.com')) {
                          iframe.setAttribute('src', 'about:blank');
                          iframe.remove();
                        }
                      }
                    }
                  }
                }
              }
            });

            if (document.documentElement) {
              observer.observe(document.documentElement, { childList: true, subtree: true });
            } else {
              window.addEventListener('DOMContentLoaded', function() {
                observer.observe(document.documentElement, { childList: true, subtree: true });
              });
            }
          }

          // 3. Error Event and Promise handlers
          window.addEventListener('error', function(event) {
            var msg = event.message || '';
            var errMsg = event.error ? (event.error.message || '') : '';
            var errStack = event.error ? (event.error.stack || '') : '';
            if (ignoreErrorPattern.test(msg) || ignoreErrorPattern.test(errMsg) || ignoreErrorPattern.test(errStack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var reasonStr = reason ? (reason.message || reason.stack || String(reason)) : '';
            if (ignoreErrorPattern.test(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          // onerror defineProperty
          var activeOnError = window.onerror;
          Object.defineProperty(window, 'onerror', {
            get: function() { return activeOnError; },
            set: function(newVal) {
              if (typeof newVal === 'function') {
                activeOnError = function (message, source, lineno, colno, error) {
                  var msgStr = String(message || '');
                  var errorStr = error ? (error.message || error.stack || String(error)) : '';
                  if (ignoreErrorPattern.test(msgStr) || ignoreErrorPattern.test(errorStr)) {
                    return true;
                  }
                  return newVal.call(this, message, source, lineno, colno, error);
                };
              } else {
                activeOnError = newVal;
              }
            },
            configurable: true,
            enumerable: true
          });

          // 4. postMessage interceptor
          var originalAddEventListener = window.addEventListener;
          window.addEventListener = function (type, listener, options) {
            if (type === 'message') {
              var wrappedListener = function (event) {
                var dataStr = event.data ? (typeof event.data === 'string' ? event.data : JSON.stringify(event.data)) : '';
                if (ignoreErrorPattern.test(dataStr) || (event.origin && (event.origin.includes('verify.walletconnect') || event.origin.includes('verify.reown') || event.origin.includes('walletconnect.com') || event.origin.includes('reown.com')))) {
                  return;
                }
                return listener.call(this, event);
              };
              return originalAddEventListener.call(window, type, wrappedListener, options);
            }
            return originalAddEventListener.call(window, type, listener, options);
          };

          var activeOnMessage = window.onmessage;
          Object.defineProperty(window, 'onmessage', {
            get: function() { return activeOnMessage; },
            set: function(newVal) {
              if (typeof newVal === 'function') {
                activeOnMessage = function (event) {
                  var dataStr = event.data ? (typeof event.data === 'string' ? event.data : JSON.stringify(event.data)) : '';
                  if (ignoreErrorPattern.test(dataStr) || (event.origin && (event.origin.includes('verify.walletconnect') || event.origin.includes('verify.reown') || event.origin.includes('walletconnect.com') || event.origin.includes('reown.com')))) {
                    return;
                  }
                  return newVal.call(this, event);
                };
              } else {
                activeOnMessage = newVal;
              }
            },
            configurable: true,
            enumerable: true
          });

          // 5. Native window.fetch patch to swallow requests to verify domains
          try {
            var originalFetch = window.fetch;
            var activeFetch = originalFetch;

            var getNativeFetch = function() {
              if (typeof originalFetch === 'function') return originalFetch;
              if (typeof window !== 'undefined') {
                var proto = Object.getPrototypeOf(window);
                if (proto && typeof proto.fetch === 'function') return proto.fetch;
                if (window.constructor && window.constructor.prototype && typeof window.constructor.prototype.fetch === 'function') {
                  return window.constructor.prototype.fetch;
                }
              }
              return null;
            };

            var customFetch = function(input, init) {
              var url = '';
              try {
                url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
              } catch (e) {}

              var lowerUrl = typeof url === 'string' ? url.toLowerCase() : '';
              if (
                lowerUrl.indexOf('verify.walletconnect') !== -1 ||
                lowerUrl.indexOf('verify.reown') !== -1 ||
                lowerUrl.indexOf('walletconnect.org') !== -1 ||
                lowerUrl.indexOf('walletconnect.com') !== -1 ||
                lowerUrl.indexOf('reown.com') !== -1
              ) {
                return Promise.resolve(new Response(JSON.stringify({}), { status: 200 }));
              }

              var fn = activeFetch || getNativeFetch();
              if (typeof fn === 'function') {
                return fn.apply(window, arguments);
              }
              return Promise.reject(new Error('No fetch method available'));
            };

            var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
            if (!desc || desc.configurable) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return customFetch; },
                set: function(val) {
                  if (typeof val === 'function') {
                    activeFetch = val;
                  }
                },
                configurable: true,
                enumerable: true
              });
            } else {
              try {
                window.fetch = customFetch;
              } catch (err) {}
            }
          } catch(e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="diagnostics-overlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.97); color:#f8fafc; font-family:monospace; padding:32px; z-index:999999; overflow:auto;">
      <div style="max-width:800px; margin:40px auto 0 auto; border:1px solid #ef4444; border-radius:16px; background:#0f172a; padding:32px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)">
        <h2 style="color:#ef4444; margin-top:0; font-size:22px; display:flex; align-items:center; gap:10px; font-family:system-ui, sans-serif;">
          <span>⚠️</span> Arc Portal Diagnostic Console
        </h2>
        <p style="color:#94a3b8; font-size:14px; line-height:1.6; font-family:system-ui, sans-serif;">
          The application frontend was unable to mount of finish loading. This usually indicates an uncaught module evaluation exception during Web3 / Wagmi loading. Review the stack trace details below:
        </p>
        <pre id="diagnostics-log" style="background:#020617; padding:20px; border-radius:10px; border:1px solid #1e293b; color:#38bdf8; overflow:x-auto; white-space:pre-wrap; font-size:12px; line-height:1.6; max-height:450px; margin-top:20px; font-family:Consolas, Monaco, monospace;"></pre>
        <div style="margin-top:24px; display:flex; gap:12px; align-items:center;">
          <button onclick="window.location.reload()" style="background:#3b82f6; hover:background:#2563eb; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; font-family:system-ui, sans-serif; transition:all 0.15s ease;">
            Reload Application
          </button>
          <button onclick="document.getElementById('diagnostics-overlay').style.display='none'" style="background:transparent; color:#64748b; border:1px solid #1e293b; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; font-family:system-ui, sans-serif;">
            Dismiss Console
          </button>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var logs = [];
        var shown = false;
        var ignorePattern = /has not been authorized yet|walletconnect|reown|closed without opened|without opened|vite-ping|failed to connect to websocket|wss?:|code: 3000|JWT validation error|Serialization error|EOF while parsing|connection closed abnormally/i;
        
        function appendLog(type, details) {
          logs.push('[' + type + '] ' + details);
          triggerDisplay();
        }

        window.addEventListener('error', function(e) {
          var errText = (e.message || 'Unknown Error') + '\nSource: ' + (e.filename || 'unknown') + ':' + (e.lineno || '0') + ':' + (e.colno || '0');
          if (ignorePattern.test(errText)) {
            return;
          }
          if (e.error && e.error.stack) {
            errText += '\nStack Trace:\n' + e.error.stack;
          }
          appendLog('ERROR', errText);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var reasonStr = reason ? (reason.stack || reason.message || String(reason)) : 'Promise rejected.';
          if (ignorePattern.test(reasonStr)) {
            return;
          }
          appendLog('REJECTION', reasonStr);
        });

        // Trigger loading timeout check when root remains unmounted after 15 seconds
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            appendLog('TIMEOUT', 'App did not mount children inside #root within 15000ms. Under heavy Wagmi / Reown loading or slow CDN conditions, this may take a few extra seconds. Click dismiss to close this pane.');
          }
        }, 15000);

        function triggerDisplay() {
          var overlay = document.getElementById('diagnostics-overlay');
          var pre = document.getElementById('diagnostics-log');
          if (overlay && pre) {
            pre.textContent = logs.join('\n\n');
            overlay.style.display = 'block';
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
